<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <title>Cobrinha 3D</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas.emscripten {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
      var Module = {
        canvas: document.getElementById('canvas'),
      };

      /**
      
    O jogo roda numa resolução interna fixa e quadrada (1000x1000).
       Em vez de depender de "object-fit" no canvas — suporte
       inconsistente em canvas com contexto WebGL, especialmente no
       Firefox — calculamos o maior quadrado que cabe na janela e
       fixamos esse tamanho via JS, em pixels absolutos. Reaplicado
       ao redimensionar a janela e depois que o jogo termina de
       inicializar (que pode mexer no tamanho do canvas).
      
      */
      function fitCanvas() {
        var canvas = document.getElementById('canvas');
        var size = Math.min(window.innerWidth, window.innerHeight);
        canvas.style.setProperty('width', size + 'px', 'important');
        canvas.style.setProperty('height', size + 'px', 'important');
      }
      window.addEventListener('resize', fitCanvas);
      Module.onRuntimeInitialized = fitCanvas;
      fitCanvas();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
